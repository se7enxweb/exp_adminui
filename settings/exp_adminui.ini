#?ini charset="utf-8"?
# Exponential Admin UI settings. Ported from ngadminui.ini of the Netgen Admin UI bundle (ViewSettings,
# SnippetEditorSettings) and from the bundle's Symfony parameters (title, logo type, menu plugins).

[AdminUISettings]
# The name in the <title>, the generator meta tag and the logo's title
Title=Exponential Admin UI
# The logo: style.css and adminui.css draw .logo-type-<LogoType>: exponential (the Exponential logo, the default),
# default (the platform logo of the reference) or ngadminui (the reference's own logo)
LogoType=exponential
# Navigation parts whose pages have no "You are here" path. The reference draws its Layouts pages without one, and
# style.css places the Layouts lists for a page without it.
NoPathNavigationParts[]
NoPathNavigationParts[]=ezexplayoutsuinavigationpart

[MenuPlugins]
# The side bar menu, top to bottom: legacy = the admin top menu (menu.ini [TopAdminMenu]); layouts, tags and
# information_collection = links to those admin modules; cache = the clear cache dropdown; bookmarks = the bookmarks
# dropdown. Leave one out to hide it.
Enabled[]
Enabled[]=legacy
Enabled[]=layouts
Enabled[]=tags
Enabled[]=information_collection
Enabled[]=cache
Enabled[]=bookmarks

[MenuPlugin_layouts]
URL=explayouts_ui/rule_list

[MenuPlugin_tags]
URL=tags/dashboard

[MenuPlugin_information_collection]
URL=infocollector/overview

[ViewSettings]
DefaultTabs[]
DefaultTabs[ng_frontpage]=subitems
DefaultTabs[ng_category]=subitems
DefaultTabs[ng_category_page]=subitems
DefaultTabs[ng_landing_page]=subitems
DefaultTabs[ng_container]=subitems
DefaultTabs[ng_gallery]=subitems
DefaultTabs[folder]=subitems
DefaultTabs[user_group]=subitems
# The default tab of the content full view: view, subitems, translations, locations or relations.
# DefaultTabs[class_identifier] overrides it per class.
DefaultTab=view

[SnippetEditorSettings]
# Classes whose text fields are edited with the Ace code editor
ClassList[]
ClassList[]=ng_htmlbox

[SnippetEditorClass_ng_htmlbox]
# Fields (eztext only) with the editor
FieldList[]
FieldList[]=html_code
# Optional per field: mode (default html), theme (default chrome), highlight_active_line (default true),
# show_print_margin (default false)
SnippetEditorConfig_html_code[mode]=html
SnippetEditorConfig_html_code[theme]=chrome
SnippetEditorConfig_html_code[highlight_active_line]=true
SnippetEditorConfig_html_code[show_print_margin]=false
